network:
  8000/tcp: My Bank API port. Leave empty unless you want to reach /docs or the API from another device.
configuration:
  api_token:
    name: API token (optional)
    description: Token for clients other than Home Assistant (scripts, /docs). Home Assistant gets its own token automatically.
  docs:
    name: Interactive documentation
    description: Serve /docs, /redoc and /openapi.json. Off by default, as these pages are readable without a token (they describe the API, not your data).
